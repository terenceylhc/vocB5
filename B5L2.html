  <style>
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
    }

    /* 3D Flip Card Container & Transitions */
    .card-scene {
      perspective: 1400px;
      width: 100%;
    }

    .card-flipper {
      position: relative;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-style: preserve-3d;
    }

    .card-flipper.is-flipped {
      transform: rotateY(180deg);
    }

    /* Front and Back Face 3D Layering in same coordinate space (no vertical stacking) */
    .card-face {
      grid-area: 1 / 1 / 2 / 2;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 28px;
      background-color: #ffffff;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transform-style: preserve-3d;
    }

    .card-face-front {
      transform: rotateY(0deg);
      z-index: 2;
    }

    .card-face-back {
      transform: rotateY(180deg);
      z-index: 1;
    }

    .card-flipper.is-flipped .card-face-back {
      z-index: 3;
    }

    /* 16:9 Visual Cue Panel with 406% Safe Zone Cropping */
    .image-crop-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      position: relative;
      background-color: #0f172a;
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
    }

    .sprite-img {
      width: 100%;
      height: 100%;
      background-size: 406% 406%;
      background-repeat: no-repeat;
      transform: translate3d(0, 0, 0);
      transition: transform 0.35s ease;
    }

    .card-container:hover .sprite-img {
      transform: scale(1.02);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

        "mnemonic": "小童軍圍坐在溫暖營火旁，就著微光在大地圖上指指點點，一起認真討論商量接下來的路線！",
        "ex": "Annie had trouble choosing a topic, so she talked it over with her teacher.",
        "grid": 2,
        "pos_idx": 12
      },
      {
        "en": "pass away",
        "ph": "",
        "pos": "phr.",
        "cn": "過世，去世",
        "strategy": "圖像法 (靈魂化作白鳥飛向星空)",
        "mnemonic": "老法師安詳過世，身上的光輝化作一隻純白的和平飛鳥穿過窗櫺，飛向靜謐的星空！",
        "ex": "Lily's grandfather passed away last month from a heart attack.",
        "grid": 2,
        "pos_idx": 13
      },
      {
        "en": "take pride in",
        "ph": "",
        "pos": "phr.",
        "cn": "以……為傲",
        "strategy": "圖像法 (胸前掛著金牌的自信大廚)",
        "mnemonic": "金牌大廚挺起胸膛展示特製的冠軍蛋糕，神采飛揚，以自己精湛的料理手藝為傲！",
        "ex": "The singer takes pride in her work because she knows her songs bring joy.",
        "grid": 2,
        "pos_idx": 14
      }
    ];

    let currentSpeechRate = 1.0;
    const reviewedSet = new Set();

    function showToast(msg, icon = '🔊') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');
      
      toastMsg.textContent = msg;
      toastIcon.textContent = icon;
      toast.classList.remove('translate-y-24', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-24', 'opacity-0');
      }, 1600);
    }

    function speakWord(text) {
      if (!('speechSynthesis' in window)) {
        showToast('此瀏覽器不支援語音合成', '⚠️');
        return;
      }
      window.speechSynthesis.cancel(); // Stop ongoing speech
      const cleanWord = text.replace(/[()]/g, '').trim();
      const utterance = new SpeechSynthesisUtterance(cleanWord);
      utterance.lang = 'en-US';
      utterance.rate = currentSpeechRate;

      // Select high-quality English voice if available
      const voices = window.speechSynthesis.getVoices();
      const enVoice = voices.find(v => (v.lang === 'en-US' || v.lang.startsWith('en')) && v.name.includes('Natural')) 
                   || voices.find(v => v.lang === 'en-US' || v.lang.startsWith('en'));
      if (enVoice) utterance.voice = enVoice;

      window.speechSynthesis.speak(utterance);
      showToast(`發音: ${cleanWord}`);
    }

    function getSpritePosition(posIdx) {
      const row = Math.floor(posIdx / 4); // 0, 1, 2, 3
      const col = posIdx % 4;             // 0, 1, 2, 3
      // For 4 items (0 to 3), the percentage steps are 0%, 33.333333%, 66.666667%, 100%
      const xPercent = (col / 3) * 100;
      const yPercent = (row / 3) * 100;
      return `${xPercent.toFixed(4)}% ${yPercent.toFixed(4)}%`;
    }

    const cardsGrid = document.getElementById('cardsGrid');

    function renderCards() {
      cardsGrid.innerHTML = '';

      VOCAB_DATA.forEach((item, index) => {
        const bgPos = getSpritePosition(item.pos_idx);
        const imageUrl = SPRITE_URLS[item.grid];

        const cardArticle = document.createElement('article');
        cardArticle.className = 'card-scene w-full h-auto cursor-pointer select-none';
        cardArticle.setAttribute('data-index', index);

        cardArticle.innerHTML = `
          <div class="card-flipper" id="flipper-${index}">
            <!-- Card Front (Visual Cue Panel) -->
            <div class="card-face card-face-front border border-slate-200/80 hover:shadow-2xl transition-all duration-300">
              
              <!-- 16:9 Image Zone with 406% safe zone cropping -->
              <div class="image-crop-box relative group">
                <div class="sprite-img" style="background-image: url('${imageUrl}'); background-position: ${bgPos};" loading="lazy"></div>
                <!-- Top-right Quick Audio Pill -->
                <button class="audio-btn absolute top-3 right-3 z-10 w-10 h-10 rounded-full bg-white/90 hover:bg-white text-slate-800 shadow-md flex items-center justify-center text-lg active:scale-95 transition-transform" 
                        data-word="${item.en}" title="聽發音" aria-label="朗讀單字">
                  🔊
                </button>
                <div class="absolute bottom-2 left-3 z-10 px-2 py-0.5 rounded-md bg-black/60 backdrop-blur-xs text-[11px] font-bold text-white tracking-wide">
                  #${index + 1}
                </div>
              </div>

              <!-- Front Text Area (Vertically Centered) -->
              <div class="p-6 md:p-8 flex flex-col items-center justify-center text-center flex-1 my-auto">
                <h2 class="text-slate-900 tracking-tight leading-tight" style="font-size: 2.5rem; font-weight: 900;">
                  ${item.en}
                </h2>
                
                <div class="flex items-center justify-center gap-2 mt-2">
                  <span class="text-slate-500 font-mono tracking-wide" style="font-size: 1.1rem;">
                    ${item.ph ? `/${item.ph}/` : ''}
                  </span>
                  <button class="audio-btn p-1.5 rounded-full hover:bg-slate-100 text-slate-700 transition active:scale-90" 
                          data-word="${item.en}" title="聽發音">
                    🔊
                  </button>
                </div>

                <div class="mt-4 flex items-center gap-1.5 text-xs text-amber-600 font-bold bg-amber-50 px-3 py-1 rounded-full border border-amber-200/60">
                  <span>🔄 點擊翻面查看記憶法與例句</span>
                </div>
              </div>
            </div>

            <!-- Card Back (Textual Content Panel - Vertically Centered Content) -->
            <div class="card-face card-face-back border border-slate-200/80 p-6 md:p-8 flex flex-col justify-between text-center relative hover:shadow-2xl transition-all duration-300">
              
              <!-- Back Card Top Action Bar -->
              <div class="flex items-center justify-between w-full mb-3">
                <span class="text-xs font-black text-slate-400">NO. ${String(index + 1).padStart(2, '0')}</span>
                <div class="flex items-center gap-2">
                  <button class="audio-btn w-9 h-9 rounded-full bg-slate-100 hover:bg-amber-100 hover:text-amber-800 text-slate-700 flex items-center justify-center text-base transition active:scale-90 shadow-2xs" 
                          data-word="${item.en}" title="再次發音">
                    🔊
                  </button>
                  <span class="text-xs text-slate-400 hover:text-slate-600 font-medium">翻回正面 ↺</span>
                </div>
              </div>

              <!-- Main Target Word (3.2rem, 900 weight, #0f172a) -->
              <h2 class="tracking-tight leading-none mb-3 break-words" style="font-size: 3.2rem; font-weight: 900; color: #0f172a;">
                ${item.en}
              </h2>

              <!-- POS Tag & Chinese Meaning -->
              <div class="flex flex-wrap items-center justify-center gap-2 mb-3">
                <span class="px-2.5 py-1 rounded-md text-slate-700 font-bold italic" style="font-size: 1.1rem; background-color: #e2e8f0;">
                  ${item.pos}
                </span>
                <span class="font-extrabold text-slate-800 tracking-tight" style="font-size: 1.6rem;">
                  ${item.cn}
                </span>
              </div>

              <!-- Strategy Tip Block (Font enlarged for prominent cognitive cue) -->
              <div class="mb-4">
                <span class="inline-block px-4 py-2 rounded-xl bg-sky-50 border border-sky-200 text-sky-800 font-extrabold tracking-wide shadow-2xs" style="font-size: 1.15rem;">
                  💡 策略：${item.strategy}
                </span>
              </div>

              <!-- Mnemonic Block -->
              <div class="w-full text-left shadow-md mb-5" 
                   style="border-radius: 20px; background-color: #ff9800; color: #ffffff; font-weight: bold; font-size: 1.1rem; line-height: 1.65; padding: 16px 20px;">
                <p class="drop-shadow-xs leading-relaxed">
                  ${item.mnemonic}
                </p>
              </div>

              <!-- Example Sentence Area -->
              <div class="w-full pt-4 text-left border-t border-dashed border-gray-300 mt-auto">
                <span class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">EXAMPLE</span>
                <p class="leading-relaxed" style="font-size: 1.25rem; color: #475569; font-style: italic;">
                  "${item.ex}"
                </p>
              </div>
            </div>
          </div>
        `;

        cardsGrid.appendChild(cardArticle);
      });
    }

    function setupInteractions() {
      // Card Flip click handler
      cardsGrid.addEventListener('click', (e) => {
        // If clicking on audio button, speak without flipping
        const audioBtn = e.target.closest('.audio-btn');
        if (audioBtn) {
          e.stopPropagation();
          const word = audioBtn.getAttribute('data-word');
          speakWord(word);
          return;
        }

        // Otherwise find card scene
        const scene = e.target.closest('.card-scene');
        if (!scene) return;

        const index = scene.getAttribute('data-index');
        const flipper = document.getElementById(`flipper-${index}`);
        const willBeBack = !flipper.classList.contains('is-flipped');

        flipper.classList.toggle('is-flipped');

        // When flipping to the back (learning side), automatically read aloud once
        if (willBeBack) {
          const item = VOCAB_DATA[index];
          speakWord(item.en);

          // Update reviewed stats
          reviewedSet.add(index);
          updateCounter();
        }
      });

      // Batch flip controls
      document.getElementById('allFrontBtn').addEventListener('click', () => {
        document.querySelectorAll('.card-flipper').forEach(f => f.classList.remove('is-flipped'));
        showToast('已全部切換至正面', '🎴');
      });

      document.getElementById('allBackBtn').addEventListener('click', () => {
        document.querySelectorAll('.card-flipper').forEach((f, idx) => {
          f.classList.add('is-flipped');
          reviewedSet.add(String(idx));
        });
        updateCounter();
        showToast('已全部切換至反面', '📖');
      });

      // Speed Toggle
      const speedBtn = document.getElementById('speedToggleBtn');
      const speedLabel = document.getElementById('speedLabel');
      const speeds = [1.0, 0.8, 1.2];
      let speedIdx = 0;

      speedBtn.addEventListener('click', () => {
        speedIdx = (speedIdx + 1) % speeds.length;
        currentSpeechRate = speeds[speedIdx];
        speedLabel.textContent = `${currentSpeechRate.toFixed(1)}x`;
        showToast(`發音速度設定為 ${currentSpeechRate.toFixed(1)}x`, '⚡');
      });
    }

    function updateCounter() {
      const counterEl = document.getElementById('learnedCounter');
      if (counterEl) {
        counterEl.textContent = `已複習 ${reviewedSet.size} / ${VOCAB_DATA.length}`;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderCards();
      setupInteractions();
      
      // Pre-warm Web Speech voices
      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {
          window.speechSynthesis.getVoices();
        };
      }
    });
  </script>
</body>
</html>
