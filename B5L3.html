      display: inline-flex;

      gap: 8px;

      max-width: 1240px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 32px;

      }

      cursor: pointer;
      width: 100%;
    }

    .card {

      position: relative;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      background-color: var(--card-bg);
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
      transform-style: preserve-3d;
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
    }

    .card:hover {
      box-shadow: var(--shadow-hover);
    }

    .card.is-flipped {
      transform: rotateY(180deg);
    }

      grid-area: 1 / 1 / 2 / 2;
      width: 100%;
      border-radius: var(--radius);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
    }

    .card-front {
      z-index: 2;
      transform: rotateY(0deg);
    }

      width: 100%;
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
      border-top-left-radius: var(--radius);
      border-top-right-radius: var(--radius);
      background-color: #f1f5f9;

      width: 100%;
      height: 100%;
      background-size: 406% 406%;
      background-repeat: no-repeat;
      background-color: #f8fafc;
      transform-origin: center center;
      transition: transform 0.4s ease;
      image-rendering: smooth;
      transform: translateZ(0);
    }

    .card:hover .sprite-img {
      transform: scale(1.03) translateZ(0);
    }

      padding: 28px 24px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;

      justify-content: center;

      color: #94a3b8;
      font-weight: 600;
      letter-spacing: 0.02em;

      transform: rotateY(180deg);
      align-items: center;
      justify-content: center;
      padding: 38px 28px;
      text-align: center;
      min-height: 100%;

      font-size: 3.2rem;
      font-weight: 900;
      color: #0f172a;
      line-height: 1.1;
      margin-bottom: 14px;
      letter-spacing: -0.02em;

      display: flex;

      gap: 12px;

    const isLocal = window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    let gridImages = {
      1: isLocal ? "B5L3G1.jpg" : "https://raw.githubusercontent.com/terenceylhc/vocB5/main/B5L3G1.jpg",
      2: isLocal ? "B5L3G2.jpg" : "https://raw.githubusercontent.com/terenceylhc/vocB5/main/B5L3G2.jpg"
    };

    // 計算 4x4 精靈圖的背景百分比位置
    function calculateSpritePosition(posIdx) {
      const col = posIdx % 4;
      const row = Math.floor(posIdx / 4);
      const posX = (col * (100 / 3)).toFixed(4);
      const posY = (row * (100 / 3)).toFixed(4);
      return `${posX}% ${posY}%`;
    }

    // Web Speech API 語音朗讀
    function speakWord(word) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    function renderCards() {
      const container = document.getElementById('cardsGrid');
      container.innerHTML = '';

      vocabData.forEach((item, index) => {
        const bgPos = calculateSpritePosition(item.pos_idx);
        const imgSrc = gridImages[item.grid] || `B5L3G${item.grid}.jpg`;

        const scene = document.createElement('div');
        scene.className = 'card-scene';

        scene.innerHTML = `
          <div class="card" id="card-${index}">
            <!-- 【正面呈現 (Visual Cue Panel)】 -->
            <div class="card-face card-front">
              <div class="image-wrapper">
                <div class="sprite-img" id="sprite-${index}" 
                     style="background-image: url('${imgSrc}'), url('B5L3G${item.grid}.jpg'); background-position: ${bgPos};">
                </div>
              </div>
              <div class="front-text-area">
                <div class="front-word">${item.en}</div>
                <div class="front-meta">
                  <span>${item.ph ? `[${item.ph}]` : ''}</span>
                  <button type="button" class="audio-btn" title="朗讀發音" onclick="event.stopPropagation(); speakWord('${item.en.replace(/'/g, "\'")}')">🔊</button>
                </div>
                <div class="flip-hint">👆 點擊卡片查看記憶口訣</div>
              </div>
            </div>

            <!-- 【反面呈現 (Textual Content Panel)】 -->
            <div class="card-face card-back">
              <div class="back-word">${item.en}</div>
              <div class="pos-and-meaning">
                <span class="pos-tag">${item.pos}</span>
                <span class="meaning-text">${item.cn}</span>
              </div>
              <div class="strategy-hint">💡 策略：${item.strategy}</div>
              <div class="mnemonic-box">${item.mnemonic}</div>
              <div class="example-area">"${item.ex}"</div>
            </div>
          </div>
        `;

        const card = scene.querySelector('.card');
        
        // 點擊卡片翻面並自動朗讀一次單字
        scene.addEventListener('click', () => {
          card.classList.toggle('is-flipped');
          speakWord(item.en);
        });

        container.appendChild(scene);
      });
    }

    document.getElementById('imageUploader').addEventListener('change', function(e) {
      const files = Array.from(e.target.files);
      files.forEach(file => {
        const objectUrl = URL.createObjectURL(file);
        const nameUpper = file.name.toUpperCase();
        if (nameUpper.includes('G1') || nameUpper.includes('L3G1') || nameUpper.includes('1')) {
          gridImages[1] = objectUrl;
        }
        if (nameUpper.includes('G2') || nameUpper.includes('L3G2') || nameUpper.includes('2')) {
          gridImages[2] = objectUrl;
        }
      });
      renderCards();
    });

    // 初始化網頁渲染
    renderCards();
  </script>
